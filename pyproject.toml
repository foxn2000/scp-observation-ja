[project]
name = "scp-observation-ja"
version = "0.1.0"
description = "SCP 観測日誌ベンチマークの verifiers v1 評価環境"
readme = "README.md"
license = "CC-BY-SA-4.0"
requires-python = ">=3.11,<3.14"
dependencies = ["verifiers==0.2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = [".venv*", ".cache", ".tmp", "dist", "outputs"]

[tool.hatch.build.targets.wheel]
packages = ["scp_observation_ja"]

[tool.pytest.ini_options]
testpaths = ["tests"]
